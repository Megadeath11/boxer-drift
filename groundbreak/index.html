<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundbreak</title>
<style>
  :root {
    --panel: rgba(16, 18, 20, 0.72);
    --line: rgba(255, 255, 255, 0.12);
    --text: #eceae4;
    --dim: #a9a59b;
    --accent: #f2b01e;
    --hot: #ff5a3c;
    --ok: #4fd36b;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f10; color: var(--text);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; }
  .ttl { font-weight: 700; letter-spacing: .02em; color: var(--accent); margin-bottom: 2px; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  #hud { left: 12px; top: 12px; width: 280px; }
  #hud .row, #help .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px dotted var(--line); }
  #hud .row span { color: var(--dim); }
  #hud .row b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .gauge, .bar { height: 7px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .gauge i, .bar i { display: block; height: 100%; background: linear-gradient(90deg, #3fb950, #f2b01e 70%, #ff5a3c); }
  .bar i { background: var(--accent); }
  .warn { color: var(--hot); font-weight: 700; margin-top: 6px; }
  .fps { color: var(--dim); font-size: 10px; margin-top: 6px; }
  #job { right: 12px; top: 12px; width: 300px; }
  #job .obj { margin-top: 8px; }
  #job .sm { color: var(--dim); font-size: 11px; margin-top: 3px; }
  #help { left: 12px; bottom: 12px; width: 280px; }
  #help .row span { color: var(--dim); text-align: right; }
  #help .sep { height: 6px; }
  kbd { font: 600 11px ui-monospace, Menlo, Consolas, monospace; background: rgba(255,255,255,.1); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  #machines { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
  #machines button { pointer-events: auto; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
  #machines button.on { border-color: var(--accent); color: var(--accent); }
  #grade { right: 330px; top: 50%; transform: translateY(-50%); width: 64px; text-align: center; display: none; }
  #grade .lbl { font-size: 10px; color: var(--dim); letter-spacing: .1em; }
  #grade .scale { position: relative; height: 160px; margin: 6px auto; width: 14px; border-radius: 7px;
    background: linear-gradient(#ff5a3c, #f2b01e 42%, #4fd36b 48% 52%, #3a7bff 58%, #2140c0); }
  #grade .tgt { position: absolute; left: -8px; right: -8px; top: 50%; height: 2px; background: #fff; }
  #grade .tip { position: absolute; left: -10px; width: 34px; height: 4px; margin-top: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 6px #000; }
  #grade .val { font: 700 13px ui-monospace, Menlo, monospace; }
  #grade .val.ok { color: var(--ok); } #grade .val.low { color: #6aa0ff; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #0d0f10; z-index: 10; }
  #loading .box { text-align: center; }
  #loading h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: .08em; color: var(--accent); }
  #loading .status { color: var(--dim); }
  #clickhint { left: 50%; top: 18px; transform: translateX(-50%); color: var(--dim); font-size: 12px; }
  @media (max-width: 900px) {
    #job { width: 220px; } #hud { width: 220px; } #help { display: none !important; } #grade { right: 250px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="box"><h1>GROUNDBREAK</h1><div class="status">Loading…</div></div></div>
<div id="hud" class="panel"></div>
<div id="job" class="panel"></div>
<div id="help" class="panel"></div>
<div id="grade" class="panel"></div>
<div id="clickhint" class="panel">Click or press a key to enable engine sound</div>
<div id="machines">
  <button>1 · Excavator</button><button>2 · Dump truck</button><button>3 · Dozer</button>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
